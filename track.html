<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Track Order — Peacock Fashions</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/peacock.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <div id="app-header"></div>
  <main class="container" style="max-width:640px;padding:48px 20px;color:var(--ink)">
    <h1 style="font-family:Fraunces,serif;font-size:2rem;margin-bottom:8px">Track your order</h1>
    <p style="color:var(--muted);margin-bottom:20px">Enter the order number from your confirmation message.</p>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <input id="orderNumber" placeholder="e.g. PFABC123" autocomplete="off"
        style="flex:1;min-width:200px;padding:14px 16px;border:1px solid #ddd6c8;border-radius:10px;font-family:inherit;font-size:15px">
      <button id="trackBtn" class="btn-pink" style="width:auto;padding:14px 26px;border-radius:10px">Track</button>
    </div>
    <p id="trackMsg" style="margin-top:16px;color:var(--muted)"></p>
    <div id="trackResult" style="margin-top:20px"></div>
  </main>
  <div id="app-footer"></div>
  <script src="/js/peacock-data.js"></script>
  <script src="/js/components.js"></script>
  <script src="/js/peacock.js"></script>
  <script>
    const input = document.getElementById("orderNumber");
    const msg = document.getElementById("trackMsg");
    const box = document.getElementById("trackResult");
    async function track() {
      const num = input.value.trim();
      if (!num) { msg.textContent = "Please enter your order number."; return; }
      msg.textContent = "Looking up your order…";
      box.innerHTML = "";
      try {
        const res = await fetch("/api/orders/" + encodeURIComponent(num));
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Order not found");
        const o = data.order;
        msg.textContent = "";
        box.innerHTML = `
          <div style="background:#fff;border:1px solid #e9e3d7;border-radius:12px;padding:20px">
            <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap">
              <b>${o.order_number}</b>
              <span style="color:#6b7a72">${new Date(o.created_at).toLocaleString()}</span>
            </div>
            <p style="margin:10px 0"><b>Status:</b> ${o.status} · <b>Payment:</b> ${o.payment_status}</p>
            <div style="font-size:14px;color:#5d6b63">
              ${(o.items || []).map(i => `<div>${i.qty} × ${i.name}${i.size ? " (" + i.size + ")" : ""} — ₹${Number(i.price) * Number(i.qty)}</div>`).join("")}
            </div>
            <p style="margin-top:12px;font-weight:600">Total: ₹${Number(o.total).toLocaleString("en-IN")}</p>
          </div>`;
      } catch (err) {
        msg.textContent = err.message;
      }
    }
    document.getElementById("trackBtn").addEventListener("click", track);
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") track(); });
  </script>
</body>
</html>
