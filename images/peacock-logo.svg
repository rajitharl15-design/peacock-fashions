<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <!-- Feather gradients -->
    <linearGradient id="fO" x1="0.5" y1="1" x2="0.5" y2="0">
      <stop offset="0" stop-color="#06404E"/>
      <stop offset="0.5" stop-color="#0F6B7C"/>
      <stop offset="1" stop-color="#2FA9A1"/>
    </linearGradient>
    <linearGradient id="fM" x1="0.5" y1="1" x2="0.5" y2="0">
      <stop offset="0" stop-color="#0F5F6E"/>
      <stop offset="1" stop-color="#6FD6BE"/>
    </linearGradient>
    <linearGradient id="fI" x1="0.5" y1="1" x2="0.5" y2="0">
      <stop offset="0" stop-color="#2FA9A1"/>
      <stop offset="1" stop-color="#8DE6CE"/>
    </linearGradient>
    <radialGradient id="eyeS" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#F5E0A8"/>
      <stop offset="0.5" stop-color="#D4A853"/>
      <stop offset="1" stop-color="#8B1A2B"/>
    </radialGradient>
    <linearGradient id="bodyG" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#2FA9A1"/>
      <stop offset="0.55" stop-color="#0E5A6A"/>
      <stop offset="1" stop-color="#05404E"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7FD8C0" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7FD8C0" stop-opacity="0"/>
    </radialGradient>

    <!-- Feather paths -->
    <path id="pT" d="M100 112 L104.5 40 L100 30 L95.5 40 Z"/>
    <path id="fO" d="M100 112 C110 106 112 92 110 78 C108 64 105 56 100 50 C95 56 92 64 90 78 C88 92 90 106 100 112 Z"/>
    <path id="fM" d="M100 112 C106 108 108 98 107 90 C106 82 103 74 100 68 C97 74 94 82 93 90 C92 98 94 108 100 112 Z"/>
    <path id="fI" d="M100 112 C104 109 105 102 105 96 C105 88 103 82 100 78 C97 82 95 88 95 96 C95 102 96 109 100 112 Z"/>
  </defs>

  <!-- Soft background halo -->
  <circle cx="100" cy="100" r="94" fill="url(#halo)"/>

  <!-- Gold double-ring frame with jewel inlays -->
  <g>
    <circle cx="100" cy="100" r="97" fill="none" stroke="#C4952A" stroke-width="1.6"/>
    <circle cx="100" cy="100" r="90" fill="none" stroke="#D4A853" stroke-width="6"/>
    <circle cx="100" cy="100" r="90.5" fill="none" stroke="#C4952A" stroke-width="0.8" stroke-dasharray="1 5"/>
    <circle cx="100" cy="100" r="83" fill="none" stroke="#116C7E" stroke-width="1.6" stroke-dasharray="3 6"/>
    <circle cx="100" cy="100" r="81" fill="none" stroke="#2FA9A1" stroke-width="0.8" opacity="0.6"/>
  </g>

  <!-- Jeweled compass points on the gold ring -->
  <g fill="#8B1A2B" stroke="#F5E0A8" stroke-width="1">
    <circle cx="100" cy="10" r="3"/> <circle cx="190" cy="100" r="3"/>
    <circle cx="100" cy="190" r="3"/> <circle cx="10" cy="100" r="3"/>
    <circle cx="136" cy="36" r="2.6"/> <circle cx="164" cy="164" r="2.6"/>
    <circle cx="64" cy="164" r="2.6"/>  <circle cx="36" cy="36" r="2.6"/>
  </g>

  <!-- Tail fan -->
  <g>
    <g fill="url(#eyeS)">
      <circle cx="100" cy="100" r="0"/>
    </g>
    <g>
      <g transform="rotate(-15 100 112)"><use href="#fO" fill="url(#fO)"/><use href="#pT" fill="#E8C87A"/><circle cx="100" cy="72" r="3.4" fill="url(#eyeS)" stroke="#F5E0A8" stroke-width="0.6"/></g>
      <g transform="rotate(-45 100 112)"><use href="#fO" fill="url(#fO)"/><use href="#pT" fill="#E8C87A"/><circle cx="100" cy="72" r="3.4" fill="url(#eyeS)" stroke="#F5E0A8" stroke-width="0.6"/></g>
      <g transform="rotate(-75 100 112)"><use href="#fO" fill="url(#fO)"/><use href="#pT" fill="#E8C87A"/><circle cx="100" cy="72" r="3.4" fill="url(#eyeS)" stroke="#F5E0A8" stroke-width="0.6"/></g>
      <g transform="rotate(-105 100 112)"><use href="#fO" fill="url(#fO)"/><use href="#pT" fill="#E8C87A"/><circle cx="100" cy="72" r="3.4" fill="url(#eyeS)" stroke="#F5E0A8" stroke-width="0.6"/></g>
      <g transform="rotate(-135 100 112)"><use href="#fO" fill="url(#fO)"/><use href="#pT" fill="#E8C87A"/><circle cx="100" cy="72" r="3.4" fill="url(#eyeS)" stroke="#F5E0A8" stroke-width="0.6"/></g>
      <g transform="rotate(-165 100 112)"><use href="#fO" fill="url(#fO)"/><use href="#pT" fill="#E8C87A"/><circle cx="100" cy="72" r="3.4" fill="url(#eyeS)" stroke="#F5E0A8" stroke-width="0.6"/></g>
    </g>
    <g>
      <g transform="rotate(-15 100 112)"><use href="#fM" fill="url(#fM)"/></g>
      <g transform="rotate(-45 100 112)"><use href="#fM" fill="url(#fM)"/></g>
      <g transform="rotate(-75 100 112)"><use href="#fM" fill="url(#fM)"/></g>
      <g transform="rotate(-105 100 112)"><use href="#fM" fill="url(#fM)"/></g>
      <g transform="rotate(-135 100 112)"><use href="#fM" fill="url(#fM)"/></g>
      <g transform="rotate(-165 100 112)"><use href="#fM" fill="url(#fM)"/></g>
    </g>
    <g>
      <g transform="rotate(-30 100 112)"><use href="#fI" fill="url(#fI)"/></g>
      <g transform="rotate(-60 100 112)"><use href="#fI" fill="url(#fI)"/></g>
      <g transform="rotate(-90 100 112)"><use href="#fI" fill="url(#fI)"/></g>
      <g transform="rotate(-120 100 112)"><use href="#fI" fill="url(#fI)"/></g>
      <g transform="rotate(-150 100 112)"><use href="#fI" fill="url(#fI)"/></g>
    </g>
  </g>

  <!-- Gold medallion at feather base -->
  <circle cx="100" cy="112" r="8" fill="#C4952A"/>
  <circle cx="100" cy="112" r="5.4" fill="#8B1A2B"/>
  <circle cx="100" cy="112" r="2.2" fill="#F5E0A8"/>

  <!-- Bird body -->
  <g>
    <path d="M100 148 C116 150 126 163 122 176 C118 189 100 192 100 192 C100 192 82 189 78 176 C74 163 84 150 100 148 Z" fill="url(#bodyG)"/>
    <path d="M100 178 C94 180 90 178 89 173 C90 179 95 182 100 181 Z" fill="none"/>
    <path d="M84 168 Q92 180 108 182" stroke="#E8C87A" stroke-width="1.4" fill="none" opacity="0.85"/>
    <circle cx="90" cy="172" r="1.4" fill="#E8C87A"/>
    <circle cx="96" cy="175" r="1.4" fill="#E8C87A"/>
    <circle cx="102" cy="177" r="1.4" fill="#E8C87A"/>
    <circle cx="108" cy="179" r="1.4" fill="#E8C87A"/>
    <path d="M100 152 C96 138 94 126 100 115 C106 121 104 139 100 152 Z" fill="url(#bodyG)"/>
    <path d="M100 128 Q104 136 103 146" stroke="#8DE6CE" stroke-width="1.2" fill="none" opacity="0.7"/>
  </g>

  <!-- Gold necklace -->
  <path d="M96 132 Q100 137 104 132" stroke="#E8C87A" stroke-width="1.4" fill="none"/>
  <path d="M100 138 L100 146" stroke="#E8C87A" stroke-width="1.2"/>
  <circle cx="100" cy="149" r="3.2" fill="#C4952A"/>
  <circle cx="100" cy="149" r="1.5" fill="#8B1A2B"/>

  <!-- Head -->
  <circle cx="100" cy="107" r="9.5" fill="url(#bodyG)"/>
  <circle cx="100" cy="105" r="7" fill="#0E5A6A" opacity="0.55"/>
  <!-- Crest -->
  <g stroke="#E8C87A" stroke-width="1.6" stroke-linecap="round">
    <line x1="98" y1="97.5" x2="96" y2="86"/>
    <line x1="100" y1="97.5" x2="100" y2="84"/>
    <line x1="102" y1="97.5" x2="104" y2="86"/>
  </g>
  <circle cx="96" cy="86" r="2" fill="#8B1A2B"/>
  <circle cx="100" cy="83" r="2" fill="#8B1A2B"/>
  <circle cx="104" cy="86" r="2" fill="#8B1A2B"/>
  <!-- Beak -->
  <path d="M104 103 Q112 102 112 107 Q107 109 104 108 Z" fill="#D4A853"/>
  <path d="M104 103 L108 105.5 L104 108 Z" fill="#E8C87A"/>
  <!-- Eye -->
  <circle cx="97" cy="105.5" r="2" fill="#8B1A2B"/>
  <circle cx="96.6" cy="105" r="0.7" fill="#FFF8F0"/>

  <!-- Sparkles -->
  <g fill="#E8C87A">
    <path d="M52 48 L54 52 L58 54 L54 56 L52 60 L50 56 L46 54 L50 52 Z"/>
    <path d="M148 62 L150 66 L154 68 L150 70 L148 74 L146 70 L142 68 L146 66 Z"/>
    <path d="M58 148 L60 152 L64 154 L60 156 L58 160 L56 156 L52 154 L56 152 Z"/>
    <path d="M144 152 L145.5 155 L148.5 156.5 L145.5 158 L144 161 L142.5 158 L139.5 156.5 L142.5 155 Z"/>
  </g>
</svg>